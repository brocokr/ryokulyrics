<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>녹황색사회 가사 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101a13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="녹황색사회 노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dela+Gothic+One&family=Gothic+A1:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 앨범 카드 격자 → 트랙 목록 → 가사 한 단. 가사 화면은 원문·발음·해석이 한 줄씩 짝을 이룬다 */
:root {
  --bg: #f3f6ee;
  --surface: #ffffff;
  --ink: #17301f;
  --muted: #5d6f61;
  --line: #d6e0d0;
  --leaf: #2f7a3e;
  --yolk: #e8a910;
  --on-yolk: #1f1a08;
  --mask: #dbe4d5;
  --warn-bg: #fff3d1;
  --warn-ink: #5c4300;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-head: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", sans-serif;
  --font-mix: "Noto Sans JP", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a13; --surface: #17241b; --ink: #e6efe3; --muted: #9db0a1; --line: #2b3d30;
    --leaf: #7cc58a; --yolk: #f2c247; --mask: #2b3d30; --warn-bg: #3a2f0f; --warn-ink: #f4d58a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a13; --surface: #17241b; --ink: #e6efe3; --muted: #9db0a1; --line: #2b3d30;
  --leaf: #7cc58a; --yolk: #f2c247; --mask: #2b3d30; --warn-bg: #3a2f0f; --warn-ink: #f4d58a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
.narrow { max-width: 760px; margin-inline: auto; }
a { color: var(--leaf); }
:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
body:not([data-view="home"]) .home-only { display: none; }

/* header */
.top { padding-block: 36px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: 28px; }
.top:not(:has(.hero)) { grid-template-columns: minmax(0, 1fr); }
.top-text { display: grid; gap: 14px; }
/* 제작자 인스타그램 링크 */
.maker-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.maker-k { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.maker { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 700; }
.maker:hover { border-color: var(--leaf); color: var(--leaf); }
.maker img { display: block; width: 22px; height: 22px; border-radius: 6px; }
.maker svg { display: block; width: 22px; height: 22px; padding: 2px; flex: none; fill: var(--leaf); }
/* 콜 가이드로 가는 큰 배너: 만든 사람 줄 바로 아래. 아이콘 윤곽선이 어두운 화면에서도 보이도록 바탕은 항상 흰색 */
.call-banner { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 14px 20px 14px 14px; color: var(--bg); text-decoration: none; background: var(--leaf); border-radius: 16px; }
.call-banner:hover { filter: brightness(1.08); }
.call-banner img { display: block; flex: none; width: 68px; height: 68px; padding: 10px; background: #fff; border-radius: 14px; }
.call-banner span { display: grid; flex: 1; gap: 2px; min-width: 0; }
.call-banner b { font-size: 22px; font-weight: 800; line-height: 1.25; }
.call-banner small { font-size: 13px; line-height: 1.45; word-break: keep-all; }
.call-banner::after { content: ""; flex: none; width: 11px; height: 11px; border-top: 2.5px solid currentColor; border-right: 2.5px solid currentColor; transform: rotate(45deg); }
/* 밴드 사진: 원래 비율 그대로. 파일이 없으면 자리째 빠진다 */
.hero { margin: 0; }
.hero img { display: block; width: 100%; height: auto; aspect-ratio: 2400 / 1642; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); background: var(--mask); }
.hero figcaption { margin-top: 8px; display: grid; gap: 6px; }
.hero .cap { font-size: 12px; color: var(--muted); }
/* 멤버 링크: 사진 속 위치와 같은 순서로 4칸(모바일은 2칸씩) */
.members { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.members a { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.members a:hover { border-color: var(--leaf); color: var(--leaf); }
.members img { display: block; width: 18px; height: 18px; border-radius: 5px; flex: none; }
.members span { display: grid; min-width: 0; line-height: 1.3; }
.members b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.members small { font-size: 11px; color: var(--muted); }
@media (max-width: 520px) { .members { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 공식 링크: 칸 수에 맞춰 줄을 채우고, 좁으면 다음 줄로 내려간다 */
.official { display: flex; flex-wrap: wrap; gap: 6px; }
.official a { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.official a:hover { border-color: var(--leaf); color: var(--leaf); }
.official img, .official svg { display: block; width: 16px; height: 16px; border-radius: 4px; flex: none; }
@media (max-width: 760px) {
  .top { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-top: 20px; }
  .hero { order: -1; }
}
.kicker { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
h1 { font-family: var(--font-head); font-weight: 400; font-size: clamp(34px, 7vw, 56px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 .jp { font-family: var(--font-display); display: block; font-size: .42em; letter-spacing: .02em; margin-top: 10px; }
h1 .g { color: var(--leaf); } h1 .y { color: var(--yolk); }
.lede { max-width: 62ch; color: var(--muted); margin: 0; }

/* search bar */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
.search { flex: 1 1 240px; min-width: 0; }
.search input {
  width: 100%; font: inherit; padding: 7px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.search input:focus { border-color: var(--leaf); outline: none; }
.stat { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.stat b { color: var(--ink); }

.alert { margin-top: 16px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 12px 16px; font-size: 14px; }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.alert code { background: transparent; border-color: currentColor; }

/* album grid */
.group { margin-top: 32px; }
.group h2 { font-family: var(--font-head); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 0; }
.group .sub { font-size: 13px; color: var(--muted); margin: 4px 0 14px; }
/* 한 줄 장수는 GROUPS의 cols(정규 3, 서브 4). 모바일은 아래 미디어 쿼리에서 2장씩 */
.albums { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; }
.album { display: flex; flex-direction: column; min-width: 0; overflow: hidden; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.album:hover { border-color: var(--leaf); }
.album-body { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 16px; }

/* 앨범 커버: 이미지가 없거나 깨지면 회색 칸만 남는다 */
.cover { display: block; aspect-ratio: 1; background: var(--mask); overflow: hidden; }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cover.none { margin: 0; } /* 검색 안내문의 .none 여백이 적용되지 않게 합니다 */
.cover.none img { display: none; }
.album .cover { border-bottom: 1px solid var(--line); }
.album-head .cover { border-radius: 10px; border: 1px solid var(--line); }
.cover.mini { width: 26px; flex: none; border-radius: 5px; }
.cover.mini.none { display: none; }
.album-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ord { font-weight: 800; color: var(--leaf); }
.album-title { font-family: var(--font-display); font-size: 21px; line-height: 1.25; margin-top: 6px; overflow-wrap: anywhere; }
.album-ko { font-size: 13px; color: var(--muted); }
.album-desc { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--muted); word-break: keep-all; text-wrap: balance; }
/* 작은 카드(그 외의 곡): GROUPS의 small. PC는 cols대로, 좁은 화면은 3장씩 */
.albums.small { gap: 10px; }
.albums.small .album-body { gap: 2px; padding: 10px 12px 12px; }
.albums.small .album-top { flex-wrap: wrap; gap: 0 6px; font-size: 11px; }
.albums.small .album-title { margin-top: 4px; font-size: 15px; }
.albums.small .album-ko { font-size: 11px; }
.albums.small .album-desc { margin-top: 4px; font-size: 11px; line-height: 1.4; }
.albums.small .album-foot { padding-top: 8px; }
.albums.small .meter-text { font-size: 11px; }
@media (max-width: 760px) {
  .albums.small { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .albums.small .album-body { padding: 8px 8px 10px; }
  .albums.small .album-title { font-size: 13px; }
}
.album-foot { margin-top: auto; padding-top: 12px; }
.meter { display: flex; height: 6px; border-radius: 999px; background: var(--mask); overflow: hidden; }
.meter i { display: block; height: 100%; }
.m-fill { background: var(--leaf); }
.m-second { margin-top: 4px; }
.m-ko { background: var(--yolk); }
.meter-text { margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 2px; }
.dot.leaf { background: var(--leaf); }
.dot.yolk { background: var(--yolk); }
/* 곡 목록의 가사·해석 표시 */
.marks { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.nw { white-space: nowrap; }

/* album page */
.back { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; font-size: 14px; font-weight: 700; text-decoration: none; }
.back:hover { text-decoration: underline; }
.album-head { display: grid; grid-template-columns: 168px minmax(0, 1fr); align-items: end; column-gap: 20px; padding-block: 14px 4px; }
.album-name { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 6vw, 44px); line-height: 1.15; margin: 8px 0 2px; overflow-wrap: anywhere; }
.tracks { list-style: none; margin: 18px 0 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tracks li + li { border-top: 1px dashed var(--line); }
.track { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 12px 16px; text-decoration: none; color: inherit; }
.track:hover { background: var(--bg); }
.tno { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.tjp { font-family: var(--font-jp); font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.tread { font-family: var(--font-jp); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tko { font-size: 12px; color: var(--muted); margin-left: 8px; }
.tnote { display: block; font-size: 12px; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.badge { font-size: 11px; font-weight: 800; line-height: 1.6; border-radius: 6px; padding: 0 7px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.has { border-color: var(--leaf); color: var(--leaf); }
.file-hint { font-size: 13px; color: var(--muted); margin-top: 14px; }

/* song page */
.song-head { padding-block: 14px 0; }
.song-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 6vw, 42px); line-height: 1.2; margin: 8px 0 2px; overflow-wrap: anywhere; }
.song-title .read { font-family: var(--font-jp); font-size: .42em; color: var(--muted); margin-left: 8px; }
.song-ko { color: var(--muted); }
/* 곡 화면 위 유튜브: 웹 주소로 열면 사이트 안에서 재생. 파일로 직접 열면 유튜브가 막아서(오류 153) 새 탭으로 여는 카드를 보여 준다 */
.yt-player { margin-top: 14px; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--mask); }
.yt-player iframe { display: block; width: 100%; height: 100%; border: 0; }
.yt { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-decoration: none; }
.yt:hover { border-color: var(--leaf); }
.yt-thumb { position: relative; flex: none; width: 168px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--mask); }
.yt-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.yt-thumb svg { position: absolute; inset: 0; margin: auto; width: 40px; height: 40px; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .5)); }
.yt-text { display: grid; gap: 2px; min-width: 0; }
.yt-text b { font-size: 14px; }
.yt-text small { font-size: 12px; color: var(--muted); }
.yt.plain { padding: 10px 12px; }
.yt.plain > svg { flex: none; width: 24px; height: 24px; }
@media (max-width: 520px) { .yt-thumb { width: 116px; } }
.controls {
  position: sticky; top: 0; z-index: 5; margin-top: 16px;
  background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
}
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--leaf); margin: 0; }
.hint { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--muted); }
.info, .warn { margin: 14px 0 0; font-size: 13px; border-radius: 10px; padding: 8px 12px; }
.info { background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn-ink); }

.lyrics { margin-top: 22px; }
.stanza + .stanza { margin-top: 26px; }
.row { display: grid; grid-template-columns: 1.5em minmax(0, 1fr); align-items: baseline; column-gap: 10px; padding: 5px 6px; margin-inline: -6px; border-radius: 8px; }
.row + .row { margin-top: 6px; }
.ln { font-size: 11px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; user-select: none; }
.row-body { min-width: 0; }
.jp, .pr, .hg, .ko { width: fit-content; max-width: 100%; overflow-wrap: anywhere; }
.jp { font-family: var(--font-jp); font-size: 19px; font-weight: 500; line-height: 1.9; }
/* 발음: 로마자 장음(ō, ā)이 한 글자로 들어 있는 시스템 글꼴을 먼저 쓰고, 한글 발음은 Gothic A1로 넘어간다 */
.pr { font-family: "Segoe UI", "Helvetica Neue", Arial, "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 13px; color: var(--muted); line-height: 1.5; }
.hg { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.ko { font-size: 15px; color: var(--leaf); line-height: 1.6; margin-top: 1px; }
rt { font-size: .5em; font-weight: 400; color: var(--muted); }
.no-pr .pr, .no-hg .hg, .no-furi rt { display: none; }
.mode-ko .row:not(.shown) :is(.study, .study-btn), .mode-jp .row:not(.shown) :is(.study, .study-btn) { display: none; }
.mode-ko .row, .mode-jp .row { cursor: pointer; }
.mode-ko .row:not(.shown) .ko,
.mode-jp .row:not(.shown) .jp,
.mode-jp .row:not(.shown) .pr,
.mode-jp .row:not(.shown) .hg { color: transparent; background: var(--mask); border-radius: 6px; user-select: none; }
.mode-jp .row:not(.shown) rt { color: transparent; }
.row.flash { background: color-mix(in srgb, var(--yolk) 28%, transparent); }

/* 단어·문법: 가사 줄 아래 버튼을 누르면 펼쳐지는 카드 */
.study-btn {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
  font: inherit; font-size: 12px; font-weight: 700; color: var(--leaf);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 11px; cursor: pointer;
}
.study-btn:hover { border-color: var(--leaf); }
.study-btn .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.study-btn::after { content: ""; width: 6px; height: 6px; margin: -3px 0 0 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); }
.row.open .study-btn::after { margin-top: 3px; transform: rotate(-135deg); }
.ghost-btn { font: inherit; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.ghost-btn:hover { border-color: var(--leaf); color: var(--leaf); }
.row:not(.open) .study { display: none; }
.study { margin: 8px 0 4px; padding: 8px 12px; display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--yolk); border-radius: 4px 10px 10px 4px; }
.item { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; font-size: 14px; line-height: 1.7; }
.term { font-family: var(--font-jp); font-weight: 700; font-size: 15px; line-height: 2; }
.mean { color: var(--muted); }
.tag { align-self: center; font-size: 10px; font-weight: 800; line-height: 1.5; color: var(--leaf); border: 1.5px solid var(--leaf); border-radius: 5px; padding: 0 5px; }
.study { font-family: var(--font-mix); }

/* 자세한 설명이 있는 단어: 누르면 아래로 펼쳐진다 */
.item-d > summary { list-style: none; cursor: pointer; }
.item-d > summary::-webkit-details-marker { display: none; }
.item-d > summary::after { content: ""; align-self: center; width: 6px; height: 6px; margin: -3px 0 0 -2px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
.item-d[open] > summary::after { margin-top: 3px; transform: rotate(-135deg); }
.item-d > summary:hover .term { color: var(--leaf); }
.detail { margin: 2px 0 12px 2px; padding: 4px 0 2px 14px; border-left: 2px solid var(--line); font-size: 14px; line-height: 1.9; overflow-wrap: anywhere; }
.detail p { margin: 0 0 4px; }
.detail .d-sub { margin-top: 10px; }
.detail .d-sub:first-child { margin-top: 0; }
.d-sub .d-mark { color: var(--leaf); font-weight: 800; margin-right: 4px; }
.d-sub b { font-weight: 700; margin-right: 6px; }
.d-sub span { color: var(--muted); }
.d-arrow { padding-left: 1em; color: var(--leaf); font-weight: 700; }
.d-link { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--line); }
.d-link-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.detail ul { margin: 0 0 6px; padding-left: 18px; }
.detail table { border-collapse: collapse; margin: 4px 0 8px; font-size: 13.5px; line-height: 1.8; }
.detail th, .detail td { border: 1px solid var(--line); padding: 2px 10px; text-align: left; vertical-align: bottom; }
.detail th { background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 700; }

.memo { margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.memo h2 { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; }
.memo-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.empty-card { margin-top: 22px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px 20px; }
.empty-card p { margin: 0 0 8px; }
.empty-card p:last-child { margin: 0; }
.empty-title { font-weight: 800; font-size: 16px; }
.pager { margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
/* 한 곡만 내보낸 파일: 다른 곡으로 가는 길은 없다 */
[data-single] .pager { display: none; }
[data-single] .back { pointer-events: none; color: var(--muted); }
.pager a { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.pager a:hover { border-color: var(--leaf); }
.pager .next { grid-column: 2; text-align: right; }
.pager small { font-size: 12px; color: var(--muted); }
.pager span { font-family: var(--font-jp); font-weight: 700; overflow-wrap: anywhere; }

/* search results */
.count, .none { margin: 18px 0 0; font-size: 13px; color: var(--muted); }
.results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.results a { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.results a:hover { border-color: var(--leaf); }
.where { display: block; font-size: 12px; color: var(--muted); }
.snip { display: block; margin-top: 4px; font-family: var(--font-jp); font-size: 14px; }
mark { background: var(--yolk); color: var(--on-yolk); border-radius: 3px; padding: 0 2px; }

/* help */
footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
.copyright { margin-top: 8px; font-size: 11px; }
body:not([data-view="home"]) .copyright { margin-top: 32px; text-align: center; }

/* 앱 설치: 첫 화면 맨 위 버튼과 안내 창. PC는 가운데, 좁은 화면은 아래에서 올라온다 */
.app-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; }
/* 사이트 메뉴: 가사 노트와 콜 가이드(call 폴더)를 오간다. call/index.html에도 같은 모양이 있다 */
.site-nav { display: inline-flex; padding: 2px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; }
.site-nav a { padding: 4px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--muted); text-decoration: none; border-radius: 999px; }
.site-nav a:hover { color: var(--leaf); }
.site-nav a[aria-current="page"] { color: var(--bg); background: var(--ink); }
.call-link { margin-top: 12px; padding-left: 10px; }
/* 언어 버튼(콜 가이드와 같은 모양)과 일본어 제목·설명. 긴 일본어 제목이 한 줄에 들어가도록 조금 작게 한다 */
.app-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.lang-switch button { padding: 4px 12px; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--muted); background: none; border: 0; border-radius: 999px; cursor: pointer; }
.lang-switch button:hover { color: var(--leaf); }
.lang-switch button[aria-pressed="true"] { color: var(--bg); background: var(--ink); }
h1.ja { font-family: var(--font-display); font-size: clamp(28px, 5vw, 44px); }
.lede:lang(ja) { font-family: var(--font-jp); }
.app-row + .top { padding-top: 12px; }
/* 넓은 화면: 위 줄은 제목·사진, 아래 줄은 배너·사진 설명으로 나눈다. 배너 윗선이 멤버 칸 윗선과 맞고(사진 설명 한 줄 + 간격만큼 내림), 사진 크기가 바뀌어도 어긋나지 않는다 */
@media (min-width: 761px) {
  .top:has(.hero) { row-gap: 8px; }
  .top:has(.hero) .top-text { grid-column: 1; grid-row: 1; align-self: end; }
  .hero { display: contents; }
  .hero img { grid-column: 2; grid-row: 1; align-self: end; }
  .hero figcaption { grid-column: 2; grid-row: 2; align-self: start; margin-top: 0; }
  .top:has(.hero) .call-banner { grid-column: 1; grid-row: 2; align-self: start; margin-top: calc(12px * 1.6 + 6px); }
}
@media (max-width: 760px) {
  .call-banner { margin-top: -4px; }
}
.app-btn { display: inline-flex; align-items: center; gap: 6px; border-color: var(--leaf); color: var(--leaf); }
.app-btn svg, .sheet-x svg { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.app-btn svg { width: 15px; height: 15px; }
html:has(.sheet[open]) { overflow: hidden; }
.sheet { width: min(600px, 100%); max-width: 100%; max-height: 88vh; max-height: 88dvh; margin: auto; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.sheet::backdrop { background: rgba(8, 16, 10, .55); }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.35; word-break: keep-all; }
.sheet-x { flex: none; display: grid; place-items: center; width: 32px; height: 32px; margin: -4px -6px 0 0; padding: 0; color: var(--muted); background: none; border: 0; border-radius: 50%; cursor: pointer; }
.sheet-x:hover { color: var(--ink); }
.sheet-x svg { width: 18px; height: 18px; }
.sheet-app { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.sheet-app img { display: block; flex: none; width: 64px; height: 64px; border-radius: 14px; }
.sheet-app b { font-size: 15px; font-weight: 800; }
.sheet-app p { margin: 2px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); word-break: keep-all; }
.sheet-warn { margin-top: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55; color: var(--warn-ink); background: var(--warn-bg); border-radius: 12px; word-break: keep-all; }
.sheet-warn p { margin: 0 0 8px; }
.sheet-warn b { overflow-wrap: anywhere; word-break: normal; user-select: all; }
.sheet-go { display: block; width: 100%; margin-top: 14px; padding: 11px 16px; font: inherit; font-size: 15px; font-weight: 800; color: var(--bg); background: var(--leaf); border: 0; border-radius: 12px; cursor: pointer; }
.sheet-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.sheet-tabs button { min-height: 34px; padding: 5px 12px; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--ink); background: none; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; }
.sheet-tabs button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.sheet-steps { display: grid; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; counter-reset: step; }
.sheet-steps li { counter-increment: step; display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.5; border: 1px solid var(--line); border-radius: 12px; word-break: keep-all; }
.sheet-steps li::before { content: counter(step); display: grid; place-items: center; width: 28px; height: 28px; font-size: 13px; font-weight: 800; color: var(--bg); background: var(--ink); border-radius: 50%; }
.sheet-steps b { font-weight: 800; }
.sheet-foot { margin: 12px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); word-break: keep-all; }
@media (max-width: 520px) {

}

@media (max-width: 520px) {

  .album-title { font-size: 17px; }
  .album-head { grid-template-columns: 104px minmax(0, 1fr); column-gap: 14px; }
}

function titleEn(s) {

const ALL = [];
for (const al of ALBUMS) {
  // 한국어 제목 자리에 이미 같은 영어가 있으면(Magic Hour) 되풀이하지 않는다
  al.en = titleEn(al.title) === al.ko ? "" : titleEn(al.title);
  al.tracks = al.tracks.map(([jp, ko = "", read = ""], i) => {
    // inst: 가사가 없는 곡의 {트랙 번호: 종류}(예: 인트로, 트랜지션). 진행률에서 빠지고, 빈 곡 안내 대신 "가사 없음"을 보여 준다.
    const t = { jp, ko, read, en: titleEn(jp) === ko ? "" : titleEn(jp), no: i + 1, album: al, id: `${al.key}-${i + 1}`, inst: (al.inst || {})[i + 1] || "" };
    ALL.push(t);
    return t;
  });
}
const byKey = Object.fromEntries(ALBUMS.map(al => [al.key, al]));
const norm = s => s.normalize("NFKC").toLowerCase().replace(/\s+/g, "");
for (const t of ALL) t.twins = ALL.filter(o => o !== t && norm(o.jp) === norm(t.jp));

/* ---------- 가사 파일 읽기 ---------- */

const LYRICS = {};    // 파일 이름 → { 트랙 번호: { 원문, 발음, 해석, 메모 } }
const fileState = {}; // 파일 이름 → "ok" | "missing" | "broken"
const fileErrLine = {};

// 가사 파일들이 부르는 함수. ### 줄의 번호로 곡을 나누고, [원문] 같은 칸 이름 아래 줄을 모은다.
window.가사 = function (name, text) {
  const songs = {};
  let cur = null, sec = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, "");
    const head = line.match(/^\s*###\s*(\d+)/);
    if (head) {
      cur = songs[Number(head[1])] = { 원문: [], 발음: [], 한글발음: [], 해석: [], 공부: [], 메모: [] };
      sec = null;
      continue;
    }
    if (!cur || /^\s*\/\//.test(line)) continue;
    const s = line.match(/^\s*\[(원문|발음|한글발음|해석|공부|메모)\]\s*$/);
    if (s) sec = s[1];
    else if (sec) cur[sec].push(line);
  }
  LYRICS[name] = songs;
};

function loadLyrics() {
  // 한 곡만 내보낸 파일: 가사가 페이지 안에 들어 있어 가사 폴더를 읽지 않는다
  if (window.EMBED_LYRICS) {
    for (const [name, text] of Object.entries(window.EMBED_LYRICS)) 가사(name, text);
    for (const al of ALBUMS) fileState[al.file] = "ok";
    return Promise.resolve();
  }
  addEventListener("error", e => {
    try {
      const m = /\/([^/]+)\.js$/.exec(decodeURIComponent(e.filename || ""));
      if (m && e.lineno) fileErrLine[m[1]] = e.lineno;
    } catch {}
  });
  return Promise.all(ALBUMS.map(al => new Promise(resolve => {
    const s = document.createElement("script");
    s.src = `가사/${al.file}.js`;
    s.onload = () => { fileState[al.file] = LYRICS[al.file] ? "ok" : "broken"; resolve(); };
    s.onerror = () => { fileState[al.file] = "missing"; resolve(); };
    document.head.append(s);
  })));
}

const has = lines => !!lines && lines.some(l => l.trim());
const own = t => (LYRICS[t.album.file] || {})[t.no] || null;

// 그 곡 칸이 비어 있으면, 다른 앨범에 실린 같은 곡의 가사를 빌려 온다.
function lyricsFor(t) {
  const mine = own(t);
  if (mine && has(mine.원문)) return { d: mine, from: null };
  const twin = t.twins.find(o => has(own(o)?.원문));
  if (twin) return { d: { ...own(twin), 메모: has(mine?.메모) ? mine.메모 : own(twin).메모 }, from: twin };
  return { d: mine, from: null };
}
const hasLyrics = t => has(lyricsFor(t).d?.원문);
const hasTranslation = t => has(lyricsFor(t).d?.해석);

// 빈 줄을 빼고 원문·발음·해석을 줄 번호로 짝짓는다. 절 나눔은 원문의 빈 줄을 따른다.
function layout(d) {
  const nb = lines => lines.filter(l => l.trim());
  const jp = nb(d.원문), pr = nb(d.발음), hg = nb(d.한글발음 || []), ko = nb(d.해석);
  const n = Math.max(jp.length, pr.length, hg.length, ko.length);
  const base = [d.원문, d.해석, d.발음, d.한글발음].find(has) || [];
  const stanzas = [];
  let start = 0, size = 0;
  for (const l of base) {
    if (l.trim()) size++;
    else if (size) { stanzas.push([start, start + size]); start += size; size = 0; }
  }
  if (size) { stanzas.push([start, start + size]); start += size; }
  if (start < n) stanzas.push([start, n]);
  return { jp, pr, hg, ko, n, stanzas };
}

function mismatch(L) {
  const parts = [["원문", L.jp], ["발음", L.pr], ["한글발음", L.hg], ["해석", L.ko]].filter(([, a]) => a.length);
  if (new Set(parts.map(([, a]) => a.length)).size < 2) return "";
  return parts.map(([k, a]) => `${k} ${a.length}줄`).join(" · ");
}

// [공부] 칸: 숫자만 있는 줄이 "몇 번째 가사 줄"이고, 그 아래 줄들이 "단어 - 뜻" 항목이다.
// 앞에 공백을 두고 쓴 줄은 바로 위 항목의 자세한 설명(detail)이 된다.
function studyNotes(lines) {
  const notes = {};
  let cur = null, last = null, loose = 0;
  for (const l of lines || []) {
    const s = l.trim();
    if (!s) continue;
    const num = s.match(/^(\d+)\s*(?:번째\s*줄|번째|번|줄|\.|\))?$/);
    if (num) { cur = notes[Number(num[1]) - 1] ||= []; last = null; continue; }
    if (/^\s/.test(l) && last) { last.detail.push(s); continue; }
    if (!cur) { loose++; continue; }
    const m = s.match(/^(.*?)\s+[-:]\s+(.*)$/);
    const term = m ? m[1] : s;
    last = { term, mean: m ? m[2] : "", gram: /^[～〜~]|=|→/.test(term), detail: [] };
    cur.push(last);
  }
  return { notes, loose };
}

// 같은 가사가 되풀이되면 [공부]에 처음 한 번만 적어도 그 줄들에 같은 해설을 보여 준다. 따로 적은 줄은 그대로 둔다.
function shareNotes(notes, jp) {
  const first = new Map();
  jp.forEach((s, i) => { const k = plain(s).trim(); if (notes[i]?.length && !first.has(k)) first.set(k, notes[i]); });
  return jp.map((s, i) => notes[i]?.length ? notes[i] : first.get(plain(s).trim()) || []);
}

// 설명 안의 ">> 곡이름 줄번호 항목 ①" 줄은 그 항목의 설명을 이 자리에 그대로 가져온다.
// 곡이름을 빼면 같은 곡, 끝의 ①을 빼면 설명 전체. 원본을 고치면 가져다 쓴 곳도 함께 바뀐다.
const LINK = /^>>\s*(?:(.+?)\s+)?(\d+)\s+(.+?)(?:\s+([①-⑳]))?$/;
// 가져온 설명에서는 원래 곡에만 해당하는 문장을 뺀다("이 줄", "1번째 줄"은 다른 곡에서 보면 뜻이 달라진다).
// 문장 단위로 빼고, 소제목이 그런 말이면 그 소제목 전체를 뺀다. 표와 가져오기 줄은 그대로 둔다.
const SONG_ONLY = /이 줄|이 곡|이번 가사|^가사에서|해석[의에]|여기서|\d+번째 줄/;
const isSub = l => /^[①-⑳]/.test(l);
const isRow = l => /\s\|\s/.test(l);
const dropSongOnly = l => l.replace(/\([^()]*번째 줄[^()]*\)/g, "").replace(/([.?!])\s+/g, "$1\n").split("\n").filter(s => !SONG_ONLY.test(s)).join(" ");
function generalOnly(lines, keepHead) {
  let skip = false;
  return lines.flatMap((l, i) => {
    const head = keepHead && i === 0;
    if (isSub(l)) skip = !head && SONG_ONLY.test(l);
    if (skip) return [];
    if (head || isRow(l) || l.startsWith(">>")) return [l];
    const kept = dropSongOnly(l);
    return kept ? [kept] : [];
  });
}
function findLinked(s, ctx) {
  const m = s.match(LINK);
  if (!m) return null;
  const t = m[1] ? ALL.find(o => norm(o.jp) === norm(m[1])) : ctx;
  const d = t && lyricsFor(t).d;
  const item = d && (studyNotes(d.공부).notes[m[2] - 1] || []).find(it => plain(it.term) === plain(m[3]));
  if (!item) return null;
  if (!m[4]) return { t, item, detail: generalOnly(item.detail) };
  const a = item.detail.findIndex(l => l.startsWith(m[4]));
  if (a < 0) return null;
  let b = a + 1;
  while (b < item.detail.length && !isSub(item.detail[b])) b++;
  return { t, item, detail: generalOnly(item.detail.slice(a, b), true) };
}

function linkHTML(s, ctx, owner, depth) {
  const found = depth < 6 && findLinked(s, ctx);
  if (!found) return "";
  const { t, item, detail } = found;
  // 지금 항목과 같은 말이면 제목을 되풀이하지 않는다
  if (owner && plain(owner.term) === plain(item.term)) return detailHTML(detail, t, item, depth + 1);
  return `<div class="d-link"><p class="d-link-head"><span class="term" lang="ja">${rich(item.term)}</span>${
    item.mean ? `<span class="mean">${rich(item.mean)}</span>` : ""}</p>${detailHTML(detail, t, item, depth + 1)}</div>`;
}

// 설명 줄: ① 소제목, - 목록, → 결과, " | " 표(첫 줄이 제목 칸), >> 다른 항목 가져오기, 나머지는 문단
function detailHTML(lines, ctx, owner, depth = 0) {
  let html = "", list = null, table = null;
  const flush = () => {
    if (list) html += `<ul>${list.join("")}</ul>`;
    if (table) html += `<table><thead><tr>${table[0].map(c => `<th>${rich(c)}</th>`).join("")}</tr></thead><tbody>${
      table.slice(1).map(r => `<tr>${r.map(c => `<td>${rich(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    list = table = null;
  };
  for (const s of lines) {
    if (s.startsWith(">>")) {
      flush();
      html += linkHTML(s, ctx, owner, depth);
      continue;
    }
    if (/\s\|\s/.test(s)) {
      if (list) flush();
      // 후리가나 {走|はし} 안의 | 는 앞뒤에 띄어쓰기가 없으니, 띄어 쓴 " | "로만 칸을 나눈다
      (table ||= []).push(s.replace(/^\|\s+|\s+\|$/g, "").split(/\s+\|\s+/));
      continue;
    }
    if (/^[-•・]\s+/.test(s)) {
      if (table) flush();
      (list ||= []).push(`<li>${rich(s.replace(/^[-•・]\s+/, ""))}</li>`);
      continue;
    }
    flush();
    const sub = s.match(/^([①-⑳])\s*(.*)$/);
    const pair = sub && sub[2].match(/^(.*?)\s*[：:]\s*(.+)$/);
    if (sub) html += `<p class="d-sub"><span class="d-mark">${sub[1]}</span>${pair ? `<b>${rich(pair[1])}</b><span>${rich(pair[2])}</span>` : `<b>${rich(sub[2])}</b>`}</p>`;
    else if (/^→/.test(s)) html += `<p class="d-arrow">${rich(s)}</p>`;
    else html += `<p>${rich(s)}</p>`;
  }
  flush();
  return html;
}

const studyHTML = (items, ctx) => items && items.length ? `<div class="study">${items.map(it => {
  const head = `${it.gram ? `<span class="tag">문법</span>` : ""}<span class="term" lang="ja">${rich(it.term)}</span>${
    it.mean ? `<span class="mean">${rich(it.mean)}</span>` : ""}`;
  const body = detailHTML(it.detail, ctx, it);
  return body
    ? `<details class="item-d"><summary class="item">${head}</summary><div class="detail">${body}</div></details>`
    : `<div class="item">${head}</div>`;
}).join("")}</div>` : "";

const trimBlank = lines => {
  let a = 0, b = lines.length;
  while (a < b && !lines[a].trim()) a++;
  while (b > a && !lines[b - 1].trim()) b--;
  return lines.slice(a, b);
};

/* ---------- 글자 처리 ---------- */

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const FURI = /\{([^{}|]+)\|([^{}|]+)\}/g;
// NFC: 따로 떨어진 장음 기호(o + ̄ 등)를 한 글자(ō)로 합쳐 글꼴이 바뀌어도 어긋나지 않게 한다
const rich = s => esc(s.normalize("NFC")).replace(FURI, "<ruby>$1<rt>$2</rt></ruby>");
const plain = s => s.replace(FURI, "$1");
const pad = n => String(n).padStart(2, "0");
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);

function vscodeLink(al) {
  if (location.protocol !== "file:") return "";
  const dir = decodeURIComponent(location.pathname).replace(/\/[^/]*$/, "");
  return "vscode://file" + encodeURI(`${dir}/가사/${al.file}.js`);
}

/* ---------- 저장 (보기 설정) ---------- */

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
const prefs = Object.assign({ mode: "all", pr: true, hg: true, furi: true, studyOpen: false }, store.get("ryokushaka-lyrics:prefs", {}));
if (!["all", "ko", "jp"].includes(prefs.mode)) prefs.mode = "all";
const savePrefs = () => store.set("ryokushaka-lyrics:prefs", prefs);

// 맨 아래 저작권 문구. 다른 사람의 곡을 커버한 곡은 그 곡 화면에서만 ALBUMS의 "credit"을 대신 보여 줍니다.
const copyright = document.querySelector(".copyright");
const COPYRIGHT = copyright.innerHTML;

function route() {
  copyright.innerHTML = COPYRIGHT;
  // 한 곡만 내보낸 파일은 주소와 상관없이 그 곡만 보여 준다
  if (window.SINGLE) {
    document.body.dataset.view = "song";
    document.body.dataset.single = "";
    renderSong(byKey[window.SINGLE.key].tracks[window.SINGLE.no - 1]);
    return;
  }
  const [view, key, no, line] = location.hash.replace(/^#\/?/, "").split("/");
  const al = byKey[key];
  const t = al && al.tracks[no - 1];
  // 콜 가이드에서 곡 이름으로 넘어올 때(#/t/곡이름): 가사가 있는 앨범의 곡 화면으로 보냅니다.
  if (view === "t") {
    const name = norm(decodeURIComponent(key || ""));
    const same = ALL.filter(o => norm(o.jp) === name);
    const hit = same.find(hasLyrics) || same[0];
    location.replace(hit ? `#/s/${hit.album.key}/${hit.no}` : "#/");
    return;
  }
  // 콜 가이드의 '앱 설치'를 눌렀을 때(#/install): 첫 화면에서 설치 안내 창을 엽니다.
  if (view === "install") {
    history.replaceState(null, "", "#/");
    document.body.dataset.view = "home";
    renderHome();
    openInstallSheet();
    return;
  }
  if (view === "s" && t) { document.body.dataset.view = "song"; renderSong(t, line); }
  else if (view === "a" && al) { document.body.dataset.view = "album"; renderAlbum(al); }
  else { document.body.dataset.view = "home"; renderHome(); }
}

function problems(only) {
  const list = ALBUMS.filter(al => (!only || al === only) && fileState[al.file] !== "ok");
  if (!list.length) return "";
  return `<div class="alert" role="alert"><b>가사 파일을 읽지 못했어요</b><ul>${list.map(al => {
    const f = `<code>가사/${esc(al.file)}.js</code>`;
    if (fileState[al.file] === "missing") return `<li>${f}: 파일이 없어요. 이름이 바뀌었거나 다른 폴더로 옮겨졌는지 확인해 주세요.</li>`;
    const where = fileErrLine[al.file] ? ` ${fileErrLine[al.file]}번째 줄 근처에 문제가 있어요.` : "";
    return `<li>${f}: 파일 안의 형식이 깨졌어요.${where} 맨 위의 <code>가사("${esc(al.file)}", &#96;</code>와 맨 아래의 <code>&#96;);</code>가 그대로 있는지, 가사 안에 <code>&#96;</code>(백틱)이 들어가지 않았는지 확인해 주세요.</li>`;
  }).join("")}</ul></div>`;
}

const coverHTML = (al, cls = "") => `<span class="cover${cls}"><img src="${(window.EMBED_COVERS || {})[al.key] || encodeURI(al.cover || `${al.file}.webp`)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('none')"></span>`;

const isSolo = al => al.tracks.length === 1;

function albumCard(al) {
  const all = al.tracks.length, n = al.tracks.filter(t => !t.inst).length;
  const filled = al.tracks.filter(hasLyrics).length;
  const translated = al.tracks.filter(hasTranslation).length;
  const kinds = {};
  for (const t of al.tracks) if (t.inst) kinds[t.inst] = (kinds[t.inst] || 0) + 1;
  const extra = Object.entries(kinds).map(([k, c]) => `${k} ${c}`).join(", ");
  return `<a class="album" href="${isSolo(al) ? `#/s/${al.key}/1` : `#/a/${al.key}`}">
    ${coverHTML(al)}
    <div class="album-body">
    <div class="album-top"><span class="ord">${al.label}</span><span>${al.date}</span></div>
    <div class="album-title" lang="ja">${esc(al.title)}</div>
    ${al.ko ? `<div class="album-ko">${esc(al.ko)}</div>` : ""}${al.en ? `<div class="album-ko">${esc(al.en)}</div>` : ""}
    ${al.desc ? `<div class="album-desc">${esc(al.desc)}</div>` : ""}
    <div class="album-foot">
      <div class="meter" role="img" aria-label="${n}곡 중 가사 ${filled}곡"><i class="m-fill" style="width:${filled / n * 100}%"></i></div>
      <div class="meter m-second" role="img" aria-label="${n}곡 중 해석 ${translated}곡"><i class="m-ko" style="width:${translated / n * 100}%"></i></div>
      <div class="meter-text"><span class="nw">${all}곡${extra ? ` (${extra})` : ""} ·</span> <span class="nw"><i class="dot leaf"></i>가사 ${filled}</span> <span class="nw"><i class="dot yolk"></i>해석 ${translated}</span></div>
    </div>
    </div>
  </a>`;
}

// 로마자는 ā, é 같은 표시 없이 쳐도 찾아지게 합니다. 일본어와 한글은 그대로 두고, 글자 수도 변하지 않아 표시 위치가 어긋나지 않습니다
const fold = s => s.normalize("NFC").replace(/[À-ɏ]/g, c => c.normalize("NFD")[0]).toLowerCase();

function search(needle) {
  const q = fold(needle);
  const hits = [];
  for (const t of ALL) {
    const title = [t.jp, t.ko, t.read, t.en].some(s => fold(s).includes(q));
    const { d, from } = lyricsFor(t);
    let row = -1, text = "";
    if (d && !from) {
      const L = layout(d);
      const { notes } = studyNotes(d.공부);
      for (let i = 0; i < L.n && row < 0; i++) {
        const words = (notes[i] || []).flatMap(it => [it.mean ? `${it.term} - ${it.mean}` : it.term, ...it.detail.filter(l => !l.startsWith(">>"))]);
        const s = [L.jp[i], L.pr[i], L.hg[i], L.ko[i], ...words].find(s => s && fold(plain(s)).includes(q));
        if (s) { row = i; text = plain(s); }
      }
    }
    if (title || row >= 0) hits.push({ t, row, text });
  }
  return hits;
}

function resultsHTML(hits, needle) {
  if (!hits.length) return `<p class="none">찾는 곡이나 가사가 없어요.</p>`;
  const q = fold(needle);
  const mark = raw => {
    const s = raw.normalize("NFC");
    const i = fold(s).indexOf(q);
    return i < 0 ? esc(s) : esc(s.slice(0, i)) + `<mark>${esc(s.slice(i, i + q.length))}</mark>` + esc(s.slice(i + q.length));
  };
  return `<p class="count">${hits.length}곡</p><ul class="results">${hits.map(({ t, row, text }) => `
    <li><a href="#/s/${t.album.key}/${t.no}${row >= 0 ? `/${row}` : ""}">
      <span class="where">${isSolo(t.album) ? `${t.album.label} · ${t.album.date}` : `${t.album.label} 『${esc(t.album.title)}』 · ${t.no}번`}</span>
      <span class="tjp" lang="ja">${mark(t.jp)}</span>${t.ko ? `<span class="tko">${mark(t.ko)}</span>` : ""}${t.en ? `<span class="tko">${mark(t.en)}</span>` : ""}
      ${row >= 0 ? `<span class="snip">${mark(text)}</span>` : ""}
    </a></li>`).join("")}</ul>`;
}

}

function trackRow(t) {
  const { d } = lyricsFor(t);
  return `<a class="track" href="#/s/${t.album.key}/${t.no}">
    <span class="tno">${pad(t.no)}</span>
    <span><span class="tjp" lang="ja">${esc(t.jp)}</span>${t.read ? `<span class="tread">${esc(t.read)}</span>` : ""}${t.ko ? `<span class="tko">${esc(t.ko)}</span>` : ""}${t.en ? `<span class="tko">${esc(t.en)}</span>` : ""}
      ${t.twins.length ? `<span class="tnote">${t.twins.map(o => `${o.album.label} ${o.no}번`).join(", ")}에도 실린 곡</span>` : ""}</span>
    <span class="badges">${has(d?.원문) ? `<span class="marks"><span><i class="dot leaf"></i>가사</span>${has(d?.해석) ? `<span><i class="dot yolk"></i>해석</span>` : ""}</span>` : `<span class="badge">${t.inst ? `${t.inst} · 가사 없음` : "비어 있음"}</span>`}</span>

function renderSong(t, line) {
  const al = t.album;
  const { d, from } = lyricsFor(t);
  const prev = al.tracks[t.no - 2], next = al.tracks[t.no];
  document.title = `${t.jp} · 녹황색사회 가사 노트`;

  let body = "";
  if (d && (has(d.원문) || has(d.해석))) {
    const L = layout(d);
    const { notes, loose } = studyNotes(d.공부);
    const shared = shareNotes(notes, L.jp);
    const stray = Object.keys(notes).map(Number).filter(i => i < 0 || i >= L.n);
    const warns = [];
    if (mismatch(L)) warns.push(`${mismatch(L)}: 줄 수가 달라서 뒤로 갈수록 짝이 어긋날 수 있어요.`);
    if (stray.length) warns.push(`[공부] 칸의 ${stray.map(i => i + 1).join(", ")}번은 가사에 없는 줄 번호예요.`);
    if (loose) warns.push(`[공부] 칸 맨 위에 줄 번호 없이 적힌 항목이 ${loose}개 있어요. 그 위에 줄 번호를 적어야 해요.`);
    // 한 곡만 내보낸 파일에는 다른 곡의 설명이 없으므로 확인하지 않는다
    const lost = window.SINGLE ? [] : Object.values(notes).flat().flatMap(it => it.detail).filter(l => l.startsWith(">>") && !findLinked(l, t));
    if (lost.length) warns.push(`[공부] 칸에서 가져올 설명을 찾지 못했어요: ${lost.map(l => esc(l.slice(2).trim())).join(", ")}`);
    const hasFuri = [...L.jp, ...Object.values(notes).flat().flatMap(it => [it.term, ...it.detail])].some(s => /\{[^{}|]+\|[^{}|]+\}/.test(s));
    body = `
      <div class="controls">
        <div class="seg" role="group" aria-label="가리기">
          <button type="button" data-mode="all">모두 보기</button>
          <button type="button" data-mode="ko">해석 가리기</button>
          <button type="button" data-mode="jp">원문 가리기</button>
        </div>
        ${L.pr.length ? `<label class="check"><input type="checkbox" data-pref="pr"${prefs.pr ? " checked" : ""}> 로마자</label>` : ""}
        ${L.hg.length ? `<label class="check"><input type="checkbox" data-pref="hg"${prefs.hg ? " checked" : ""}> 한글 발음</label>` : ""}
        ${hasFuri ? `<label class="check"><input type="checkbox" data-pref="furi"${prefs.furi ? " checked" : ""}> 후리가나</label>` : ""}
        ${Object.keys(notes).length ? `<button type="button" class="ghost-btn study-all"></button>` : ""}
        <p class="hint" id="hint" hidden>가려진 줄을 누르면 단어·문법과 함께 보이고, 한 번 더 누르면 다시 가려져요.</p>
      </div>
      ${from ? `<p class="info">${from.album.label} 『${esc(from.album.title)}』 ${from.no}번에 넣은 가사를 보여 주고 있어요.</p>` : ""}
      ${warns.map(w => `<p class="warn">${w}</p>`).join("")}
      <div id="lyrics">${L.stanzas.map(([a, b]) => `<div class="stanza">${range(a, b).map(i => {
        const items = shared[i] || notes[i] || [];
        const cls = items.length ? ` has-study${prefs.studyOpen ? " open" : ""}` : "";
        return `<div class="row${cls}" data-row="${i}"><span class="ln">${i + 1}</span><div class="row-body">${
          L.jp[i] ? `<div class="jp" lang="ja">${rich(L.jp[i])}</div>` : ""}${
          L.pr[i] ? `<div class="pr">${rich(L.pr[i])}</div>` : ""}${
          L.hg[i] ? `<div class="hg">${rich(L.hg[i])}</div>` : ""}${
          L.ko[i] ? `<div class="ko">${rich(L.ko[i])}</div>` : ""}${
          items.length ? `<button type="button" class="study-btn" aria-expanded="${prefs.studyOpen}">단어·문법 <span class="n">${items.length}</span></button>${studyHTML(items, t)}` : ""}</div></div>`;
      }).join("")}</div>`).join("")}</div>`;
  } else if (t.inst) {
    body = `<div class="empty-card">
      <p class="empty-title">가사가 없는 ${esc(t.inst)} 곡이에요</p>
      <p>연주만 있는 곡이라 가사·발음·해석 칸을 채우지 않아도 돼요. 앨범 진행률에서도 빠져요.</p>
    </div>`;
  } else {
    const link = vscodeLink(al);
    body = `<div class="empty-card">
      <p class="empty-title">아직 가사가 없어요</p>
      <p><code>가사/${esc(al.file)}.js</code> 파일에서 <code>### ${pad(t.no)} ${esc(t.jp)}</code> 줄 아래 <code>[원문]</code> 칸에 일본어 가사를 붙여 넣으면 여기에 보여요. <code>[발음]</code>, <code>[한글발음]</code>, <code>[해석]</code>도 같은 줄 순서로 넣으면 한 줄씩 짝지어져요.</p>
      ${t.twins.length ? `<p>${t.twins.map(o => `${o.album.label} ${o.no}번`).join(", ")}에도 실린 곡이라, 어느 한쪽에만 넣어도 양쪽에서 보여요.</p>` : ""}
      <p>${link ? `<a href="${link}">VS Code에서 이 파일 열기</a> · ` : ""}저장한 뒤 이 페이지를 새로고침해 주세요.</p>
    </div>`;
  }

  const memo = d ? trimBlank(d.메모) : [];
  app.innerHTML = `<div class="narrow">
    ${isSolo(al) && !window.SINGLE ? `<a class="back" href="#/">← 전체 앨범</a>` : `<a class="back" href="#/a/${al.key}">${window.SINGLE ? "" : "← "}${coverHTML(al, " mini")}${al.label} 『${esc(al.title)}』</a>`}
    <header class="song-head">
      <div class="album-top">${isSolo(al) ? `<span class="ord">${al.label}</span><span>${al.date}</span>` : `<span class="ord">${pad(t.no)}번 트랙</span>`}</div>
      <h1 class="song-title" lang="ja">${esc(t.jp)}${t.read ? `<span class="read">${esc(t.read)}</span>` : ""}</h1>
      ${t.ko || t.en ? `<div class="song-ko">${[t.ko, t.en].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
      ${al.desc ? `<div class="album-desc">${esc(al.desc)}</div>` : ""}
    </header>
    ${videoHTML(t)}
    ${callLinkHTML(t)}
    ${problems(al)}

    ${memo.length ? `<section class="memo"><h2>메모</h2><div class="memo-body">${memo.map(rich).join("\n")}</div></section>` : ""}
    <nav class="pager" aria-label="곡 이동">
      ${prev ? `<a class="prev" href="#/s/${al.key}/${prev.no}"><small>← 이전 곡</small><span lang="ja">${esc(prev.jp)}</span></a>` : ""}
      ${next ? `<a class="next" href="#/s/${al.key}/${next.no}"><small>다음 곡 →</small><span lang="ja">${esc(next.jp)}</span></a>` : ""}
    </nav>
  </div>`;
  applyPrefs();

  if (al.credit) copyright.innerHTML = al.credit;

  const target = line != null && document.querySelector(`[data-row="${Number(line)}"]`);
  if (target) {
    if (target.classList.contains("has-study")) setStudyOpen(target, true);
    target.scrollIntoView({ block: "center" });
    target.classList.add("flash");
  } else scrollTo(0, 0);
  syncStudyAll();
}

function setStudyOpen(row, open) {
  row.classList.toggle("open", open);
  row.querySelector(".study-btn").setAttribute("aria-expanded", open);
}

// 위쪽 버튼 글자: 하나라도 접혀 있으면 "모두 펼치기", 전부 펼쳐져 있으면 "모두 접기"
function syncStudyAll() {
  const btn = document.querySelector(".study-all");
  if (!btn) return;
  const allOpen = [...document.querySelectorAll(".row.has-study")].every(r => r.classList.contains("open"));
  btn.textContent = allOpen ? "단어·문법 모두 접기" : "단어·문법 모두 펼치기";
  btn.setAttribute("aria-expanded", allOpen);
}

function applyPrefs() {
  const box = document.getElementById("lyrics");
  if (!box) return;
  box.className = `lyrics mode-${prefs.mode}${prefs.pr ? "" : " no-pr"}${prefs.hg ? "" : " no-hg"}${prefs.furi ? "" : " no-furi"}`;
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === prefs.mode));
  document.getElementById("hint").hidden = prefs.mode === "all";
  box.querySelectorAll(".row").forEach(r => r.tabIndex = prefs.mode === "all" ? -1 : 0);
}

app.addEventListener("click", e => {
  const modeBtn = e.target.closest("[data-mode]");
  if (modeBtn) {
    prefs.mode = modeBtn.dataset.mode;
    savePrefs();
    document.querySelectorAll(".row.shown").forEach(r => r.classList.remove("shown"));
    applyPrefs();
    return;
  }
  const studyBtn = e.target.closest(".study-btn");
  if (studyBtn) {
    const r = studyBtn.closest(".row");
    setStudyOpen(r, !r.classList.contains("open"));
    syncStudyAll();
    return;
  }
  if (e.target.closest(".study-all")) {
    const rows = [...document.querySelectorAll(".row.has-study")];
    const open = !rows.every(r => r.classList.contains("open"));
    rows.forEach(r => setStudyOpen(r, open));
    prefs.studyOpen = open;
    savePrefs();
    syncStudyAll();
    return;
  }
  const row = e.target.closest(".row");
  if (row && prefs.mode !== "all" && !e.target.closest(".study")) row.classList.toggle("shown");
});

app.addEventListener("keydown", e => {
  if (e.target.closest("button, summary")) return;
  const row = e.target.closest(".row");
  if (row && prefs.mode !== "all" && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    row.classList.toggle("shown");
  }
});

app.addEventListener("change", e => {
  const key = e.target.dataset.pref;
  if (!key) return;
  prefs[key] = e.target.checked;
  savePrefs();
  applyPrefs();
});

// 가사 화면에서 ← → 키로 이전·다음 곡
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || e.altKey || e.ctrlKey || e.metaKey) return;
  const link = document.querySelector(e.key === "ArrowLeft" ? ".pager .prev" : e.key === "ArrowRight" ? ".pager .next" : null);
  if (link) location.hash = link.getAttribute("href");
});

/* ---------- 앱 설치 ---------- */

// 사이트 주소가 바뀌면 여기와 안내 문구가 함께 바뀝니다.
const APP_URL = "https://brocokr.github.io/ryokulyrics/";
const USER_AGENT = navigator.userAgent;
// 파일로 직접 열었거나 카카오톡·인스타그램 같은 앱 안의 브라우저로 열면 설치할 수 없어 휴대폰 브라우저로 열도록 안내합니다.
const CANNOT_INSTALL = location.protocol === "file:" || /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Barcelona|NAVER\(inapp|Line\/|everytimeApp|DaumApps|; wv\)/i.test(USER_AGENT);
const IS_IOS = /iPhone|iPad|iPod/.test(USER_AGENT) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const INSTALL_TABS = [
  { id: "android", name: "안드로이드 (크롬)", steps: [
    "주소창 오른쪽의 <b>⋮</b> 메뉴를 눌러요",
    "<b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b>를 눌러요",
    "<b>‘설치’</b>를 눌러요",
  ] },
  { id: "samsung", name: "갤럭시 (삼성 인터넷)", steps: [
    "오른쪽 아래의 <b>≡</b> 메뉴를 눌러요",
    "<b>‘현재 페이지 추가’</b> → <b>‘홈 화면’</b>을 눌러요",
    "<b>‘추가’</b>를 눌러요",
  ] },
  { id: "ios", name: "아이폰 / 아이패드", steps: [
    "공유 버튼(네모에 위쪽 화살표)을 눌러요. 안 보이면 주소창 옆 <b>⋯</b> → <b>‘공유’</b>를 눌러요",
    "목록을 내려서 <b>‘홈 화면에 추가’</b>를 눌러요",
    "<b>‘웹 앱으로 열기’</b>가 보이면 켜 두고 <b>‘추가’</b>를 눌러요",
  ] },
  { id: "pc", name: "PC (크롬 / 엣지)", steps: [
    "주소창 오른쪽 끝의 설치 아이콘을 눌러요",
    "안 보이면 <b>⋮</b>(엣지는 <b>⋯</b>) 메뉴 → <b>‘전송, 저장 및 공유’</b> 또는 <b>‘앱’</b> → <b>‘앱으로 설치’</b>를 눌러요",
    "<b>‘설치’</b>를 눌러요",
  ] },
];
let installTab = IS_IOS ? "ios" : /SamsungBrowser/.test(USER_AGENT) ? "samsung" : /Android/.test(USER_AGENT) ? "android" : "pc";
let installPrompt = null; // 브라우저가 바로 설치를 허락하면 담기는 이벤트. 있으면 '지금 설치하기' 버튼이 보입니다.

// 첫 화면의 한국어/日本語 버튼: 첫 화면의 제목과 설명만 바뀝니다. 가사·해석·문법 설명과 다른 화면은 한국어 그대로입니다.
// 콜 가이드와 같은 선택을 씁니다(ryokulyrics:lang). 브라우저 언어와 상관없이 처음에는 한국어로 열립니다.
let homeLang = (() => {
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked === "ja" || asked === "ko") return asked;
  try { const saved = localStorage.getItem("ryokulyrics:lang"); if (saved === "ja" || saved === "ko") return saved; } catch {}
  return "ko";
})();
// 첫 화면 맨 위 줄: 사이트 메뉴, 언어 버튼, 앱 설치 버튼. 이미 앱으로 열었으면 설치 버튼만 빠집니다.
const isInstalled = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const topRowHTML = () => `<div class="app-row"><nav class="site-nav" aria-label="사이트 메뉴"><a href="#/" aria-current="page">가사 노트</a><a href="call/index.html">콜 가이드</a></nav><div class="app-tools"><div class="site-nav lang-switch" role="group" aria-label="언어 / 言語"><button type="button" data-lang="ko" aria-pressed="${homeLang === "ko"}">한국어</button><button type="button" data-lang="ja" aria-pressed="${homeLang === "ja"}">日本語</button></div>${isInstalled() ? "" : `<button type="button" class="ghost-btn app-btn" data-install-open><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></svg>앱 설치</button>`}</div></div>`;
const installStepsHTML = () => INSTALL_TABS.find(t => t.id === installTab).steps.map(s => `<li><span>${s}</span></li>`).join("");

function installSheetHTML() {
  return `
    <div class="sheet-head">
      <h2 id="sheetTitle">홈 화면에 추가해서 앱처럼 쓰기</h2>
      <button type="button" class="sheet-x" data-sheet="close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-app">
      <img src="icon-192.png" alt="">
      <div><b>녹황색사회 노트</b><p>아이콘을 누르면 주소창 없이 전체 화면으로 열려요. 한 번 열어 둔 뒤에는 지하철처럼 인터넷이 끊겨도 가사와 콜을 볼 수 있어요.</p></div>
    </div>
    ${CANNOT_INSTALL ? `<div class="sheet-warn"><p>여기서는 설치가 안 돼요. 휴대폰 브라우저에서 <b>${APP_URL.replace(/^https:\/\/|\/$/g, "")}</b>를 열고 아래 순서대로 해 주세요.</p><button type="button" class="ghost-btn" data-sheet="copy">주소 복사</button></div>` : ""}
    ${installPrompt && !CANNOT_INSTALL ? `<button type="button" class="sheet-go" data-sheet="install">지금 설치하기</button>` : ""}
    <div class="sheet-tabs">${INSTALL_TABS.map(t => `<button type="button" data-tab="${t.id}" aria-pressed="${t.id === installTab}">${t.name}</button>`).join("")}</div>
    <ol class="sheet-steps">${installStepsHTML()}</ol>
    <p class="sheet-foot">새로 추가된 가사와 해석은 앱을 열 때 자동으로 들어와요. 영상은 인터넷이 연결되어 있을 때만 나와요. 아이콘을 지우고 싶으면 다른 앱처럼 길게 눌러서 삭제하면 돼요.</p>`;
}

function openInstallSheet() {
  let sheet = document.getElementById("installSheet");
  if (!sheet) {
    sheet = document.createElement("dialog");
    sheet.id = "installSheet";
    sheet.className = "sheet";
    sheet.setAttribute("aria-labelledby", "sheetTitle");
    sheet.addEventListener("click", onSheetClick);
    document.body.append(sheet);
  }
  sheet.innerHTML = installSheetHTML();
  sheet.showModal();
}

function onSheetClick(e) {
  const sheet = e.currentTarget;
  // 창 바깥의 어두운 부분을 누르면 닫습니다.
  if (e.target === sheet) {
    const r = sheet.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) sheet.close();
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    installTab = tab.dataset.tab;
    sheet.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", String(b === tab)));
    sheet.querySelector(".sheet-steps").innerHTML = installStepsHTML();
    return;
  }
  const button = e.target.closest("[data-sheet]");
  const action = button && button.dataset.sheet;
  if (action === "close") sheet.close();
  if (action === "copy") copyAppUrl(button);
  if (action === "install" && installPrompt) {
    const prompt = installPrompt;
    installPrompt = null;
    sheet.close();
    prompt.prompt();
  }
}

async function copyAppUrl(button) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(APP_URL);
    ok = true;
  } catch {
    // 앱 안의 브라우저는 복사 기능을 막기도 해서 옛날 방식으로 한 번 더 시도합니다.
    const box = document.createElement("textarea");
    box.value = APP_URL;
    button.after(box);
    box.select();
    try { ok = document.execCommand("copy"); } catch {}
    box.remove();
  }
  button.textContent = ok ? "복사했어요" : "복사가 안 돼요. 주소를 길게 눌러 복사할 수 있어요";
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-install-open]")) openInstallSheet();
  const langButton = e.target.closest("[data-lang]");
  if (langButton) {
    homeLang = langButton.dataset.lang;
    try { localStorage.setItem("ryokulyrics:lang", homeLang); } catch {}
    if (location.search.includes("lang=")) history.replaceState(null, "", location.pathname + location.hash);
    const y = scrollY;
    renderHome();
    scrollTo(0, y);
    document.querySelector(`[data-lang="${homeLang}"]`).focus();
  }
});
addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); // 브라우저가 띄우는 작은 안내 대신 안내 창의 버튼을 씁니다.
  installPrompt = e;
  const sheet = document.getElementById("installSheet");
  if (sheet && sheet.open) sheet.innerHTML = installSheetHTML();
});
addEventListener("appinstalled", () => {
  installPrompt = null;
  const sheet = document.getElementById("installSheet");
  if (sheet && sheet.open) sheet.close();
});

// 인터넷이 끊겨도 열리도록 가사·커버·아이콘을 저장해 둡니다(sw.js). 파일 목록은 ALBUMS에서 만들므로 곡이나 앨범을 추가해도 여기를 고칠 필요가 없습니다.
if ("serviceWorker" in navigator && location.protocol !== "file:" && !window.SINGLE) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(reg => {
      const files = new Set(["./", "index.html", "manifest.webmanifest", "icon-192.png", "icon-512.png", "icon-maskable-512.png", "apple-touch-icon.png", "Instagram_icon.png", encodeURI(PROFILE_PHOTO), "call/", "call/index.html", "call/poster.jpg", "call/zone.jpg", "call/119956.png"]);
      for (const al of ALBUMS) {
        files.add(encodeURI(`가사/${al.file}.js`));
        files.add(encodeURI(al.cover || `${al.file}.webp`));
      }
      reg.active.postMessage({ type: "save-all", files: [...files] });
    }).catch(() => {});
  });
}

loadLyrics().then(() => {
  addEventListener("hashchange", route);
  route();
});
</script>
