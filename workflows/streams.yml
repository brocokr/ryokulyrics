# 하루에 한 번 Spotify 재생 수(kworb.net)를 받아 streams.js를 새로 씁니다. 가사 노트의 인기곡 순위가 이 파일을 읽습니다.
# 같은 코드가 도구/streams/update-streams.ps1에도 있습니다.
name: streams
on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update streams.js
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Out = Join-Path (Get-Location) 'streams.js'
          $url = 'https://kworb.net/spotify/artist/4SJ7qRgJYNXB9Yttzs4aSa_songs.html'
          $res = Invoke-WebRequest -UseBasicParsing $url -UserAgent 'Mozilla/5.0' -TimeoutSec 60
          $html = [Text.Encoding]::UTF8.GetString($res.RawContentStream.ToArray())
          $day = [regex]::Match($html, 'Last updated:\s*(\d{4})/(\d{2})/(\d{2})')
          $sum = [regex]::Match($html, '>Streams</td><td>([\d,]+)</td>')
          $dly = [regex]::Match($html, '>Daily</td><td>([\d,]+)</td>')
          $rows = [regex]::Matches($html, 'open\.spotify\.com/track/\w+"[^>]*>([^<]+)</a></div></td><td>([\d,]+)</td><td>([\d,]*)</td>')
          if (-not $day.Success -or -not $sum.Success -or -not $dly.Success -or $rows.Count -lt 50) { throw "unexpected page: rows $($rows.Count)" }
          $num = { param($s) if ($s) { $s -replace ',', '' } else { '0' } }
          $list = foreach ($m in $rows) {
            $name = [Net.WebUtility]::HtmlDecode($m.Groups[1].Value).Trim().Replace('\', '\\').Replace('"', '\"')
            '  ["' + $name + '", ' + (& $num $m.Groups[2].Value) + ', ' + (& $num $m.Groups[3].Value) + ']'
          }
          $updated = $day.Groups[1].Value + '-' + $day.Groups[2].Value + '-' + $day.Groups[3].Value
          $text = 'window.STREAMS_DATA = {"updated": "' + $updated + '", "source": "' + $url + '", "total": [' + (& $num $sum.Groups[1].Value) + ', ' + (& $num $dly.Groups[1].Value) + '], "tracks": [' + "`n" + ($list -join ",`n") + "`n" + ']};' + "`n"
          $old = if (Test-Path -LiteralPath $Out) { [IO.File]::ReadAllText($Out) } else { '' }
          if ($old -eq $text) { "no change ($updated)" } else { [IO.File]::WriteAllText($Out, $text, (New-Object Text.UTF8Encoding $false)); "streams.js: $updated, $($rows.Count) tracks" }
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.js
          git diff --cached --quiet || (git commit -m "Update streams.js" && git push)
